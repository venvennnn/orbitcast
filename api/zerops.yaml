zerops:
  - setup: api
    build:
      base: python@3.12
      buildCommands:
        - rm -rf ./vendor
        - pip install --target=./vendor -r requirements.txt
      deployFiles:
        - .
    deploy:
      readinessCheck:
        httpGet:
          port: 8000
          path: /health
    run:
      base: python@3.12
      ports:
        - port: 8000
          httpSupport: true
      envVariables:
        PYTHONPATH: /var/www/vendor:/var/www
        DATABASE_URL: postgresql://${db_user}:${db_password}@${db_hostname}:${db_port}/${db_dbName}
        REDIS_URL: ${queue_connectionString}
        QUEUE_KEY: orbitcast:jobs
        S3_ENDPOINT: ${objectstorage_apiUrl}
        S3_ACCESS_KEY: ${objectstorage_accessKeyId}
        S3_SECRET_KEY: ${objectstorage_secretAccessKey}
        S3_BUCKET: ${objectstorage_bucketName}
        S3_REGION: us-east-1
        AWS_USE_PATH_STYLE_ENDPOINT: "true"
        PUBLIC_API_URL: https://api-13d-8000.sea1.zerops.app
        COVER_URL: https://storage-sea1.zerops.io/5lhkq-objectstorage/step0/cover.jpg
      start: >-
        /var/www/vendor/bin/uvicorn
        main:app
        --host 0.0.0.0
        --port 8000
